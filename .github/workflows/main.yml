name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Android SDK(先用默认 JDK,sdkmanager 需要 17+)
        uses: android-actions/setup-android@v3

      - name: 安装匹配的 NDK 和 CMake
        run: |
          sdkmanager --install "ndk;21.4.7075529" "cmake;3.10.2.4988404"

      - name: 切换到 JDK 8(旧版 AGP 3.3.2 编译需要)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: 用指定版本 Gradle 构建(项目没带 wrapper)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 4.10.1

      - name: 指定使用的 SDK / NDK 路径
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties

      - name: 编译 APK
        run: gradle assembleLiteLicCheckNoneNoinetNofsmlDebug
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: eds-lite-apk
          path: app/build/outputs/apk/**/*.apk
